name: Apply launch completion fix

on:
  push:
    branches:
      - fix/launch-completion-prefetch

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/launch-completion-prefetch
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source and documentation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          map_path = "src/screens/MapScreen.tsx"
          replace_once(
              map_path,
              '  const [isSavedObjectiveReady, setIsSavedObjectiveReady] = useState(false);\n  const [isLaunchObjectiveResolved, setIsLaunchObjectiveResolved] = useState(false);',
              '  const [isSavedObjectiveReady, setIsSavedObjectiveReady] = useState(false);\n  const [isLaunchObjectiveResolved, setIsLaunchObjectiveResolved] = useState(false);\n  const [isLaunchObjectiveStatsReady, setIsLaunchObjectiveStatsReady] = useState(false);'
          )
          replace_once(
              map_path,
              '    isSavedDataReady &&\n    isLaunchObjectiveResolved &&\n    isRecoveryCheckComplete &&',
              '    isSavedDataReady &&\n    isLaunchObjectiveResolved &&\n    isLaunchObjectiveStatsReady &&\n    isRecoveryCheckComplete &&'
          )
          replace_once(
              map_path,
              '''    // A missing snapshot can require a large district scan. Keep that work off
    // the launch overlay so pressing Start can never wait behind completion.
    if (!isLaunchDismissed) {
      setIsObjectiveStatsCalculating(false);
      return;
    }

    if (!objective) {
      setObjectiveStats(null);
      setIsObjectiveStatsCalculating(false);
      return;
    }
''',
              '''    // Completion for the launch objective and its paired city/district is
    // prepared behind the branded overlay. This keeps uncached scans away from
    // the first interactive map frame and from a walk started immediately after launch.
    if (!objective) {
      setObjectiveStats(null);
      setIsObjectiveStatsCalculating(false);
      setIsLaunchObjectiveStatsReady(true);
      return;
    }

    if (!isLaunchDismissed) {
      setIsLaunchObjectiveStatsReady(false);
    }
'''
          )
          replace_once(
              map_path,
              '          snapshot.explorationRevision === explorationRevision &&\n          snapshot.geometryFingerprint === fingerprints.get(zone.id)',
              '          (snapshot.explorationRevision === explorationRevision ||\n            snapshot.stats.permanentlyCompleted) &&\n          snapshot.geometryFingerprint === fingerprints.get(zone.id)'
          )
          replace_once(
              map_path,
              '''      .finally(() => {
        if (objectiveStatsRequestRef.current === requestId) {
          setIsObjectiveStatsCalculating(false);
        }
      });''',
              '''      .finally(() => {
        if (objectiveStatsRequestRef.current === requestId) {
          setIsObjectiveStatsCalculating(false);
          setIsLaunchObjectiveStatsReady(true);
        }
      });'''
          )
          replace_once(
              map_path,
              '      commitMapObjective(preferredZone, { showSelectionStamp: false });',
              '      setIsLaunchObjectiveStatsReady(false);\n      commitMapObjective(preferredZone, { showSelectionStamp: false });'
          )
          replace_once(
              map_path,
              '''  const objectiveProgress =
    stats?.completionPercent === null || stats?.completionPercent === undefined
      ? 0
      : Math.max(0, Math.min(100, stats.completionPercent));''',
              '''  const objectiveProgress = stats?.permanentlyCompleted
    ? 100
    : stats?.completionPercent === null || stats?.completionPercent === undefined
      ? 0
      : Math.max(0, Math.min(100, stats.completionPercent));'''
          )
          replace_once(
              map_path,
              '  if (stats?.permanentlyCompleted && stats.completionPercent === 100) {\n    return "100%";\n  }',
              '  if (stats?.permanentlyCompleted) {\n    return "100%";\n  }'
          )
          replace_once(
              map_path,
              '''function getObjectiveRemainingCells(stats: ZoneCompletionStats | null) {
  if (!stats || stats.totalZoneCells === null) {
    return null;
  }

  return Math.max(0, stats.totalZoneCells - stats.exploredCells);
}''',
              '''function getObjectiveRemainingCells(stats: ZoneCompletionStats | null) {
  if (stats?.permanentlyCompleted) {
    return 0;
  }

  if (!stats || stats.totalZoneCells === null) {
    return null;
  }

  return Math.max(0, stats.totalZoneCells - stats.exploredCells);
}'''
          )

          completion_path = "src/components/CompletionModal.tsx"
          replace_once(
              completion_path,
              '  if (stats?.permanentlyCompleted && stats.completionPercent === 100) {\n    return strings.completed;\n  }',
              '  if (stats?.permanentlyCompleted) {\n    return strings.completed;\n  }'
          )
          replace_once(
              completion_path,
              '''  if (stats.totalZoneCells === null) {
    return `${stats.exploredCells} ${strings.explored}`;
  }

  return `${stats.exploredCells} ${strings.explored}, ${Math.max(
    0,
    stats.totalZoneCells - stats.exploredCells
  )} ${strings.left}`;''',
              '''  if (stats.totalZoneCells === null) {
    return `${stats.exploredCells} ${strings.explored}`;
  }

  const remainingCells = stats.permanentlyCompleted
    ? 0
    : Math.max(0, stats.totalZoneCells - stats.exploredCells);

  return `${stats.exploredCells} ${strings.explored}, ${remainingCells} ${strings.left}`;'''
          )

          test_path = "scripts/test-ui-polish.mjs"
          replace_once(
              test_path,
              'const soundAssetReadme = readFileSync(new URL("../assets/sounds/README.md", import.meta.url), "utf8");\n',
              '''const soundAssetReadme = readFileSync(new URL("../assets/sounds/README.md", import.meta.url), "utf8");

assert.match(summarySource, /isLaunchObjectiveResolved &&\\s+isLaunchObjectiveStatsReady &&/);
assert.match(summarySource, /setIsLaunchObjectiveStatsReady\\(false\\);\\s+commitMapObjective\\(preferredZone/);
assert.match(summarySource, /snapshot\\.explorationRevision === explorationRevision \\|\\|\\s+snapshot\\.stats\\.permanentlyCompleted/);
assert.match(summarySource, /if \\(stats\\?\\.permanentlyCompleted\\) \\{\\s+return "100%";/);
assert.match(summarySource, /const objectiveProgress = stats\\?\\.permanentlyCompleted\\s+\\? 100/);
assert.match(summarySource, /if \\(stats\\?\\.permanentlyCompleted\\) \\{\\s+return 0;/);
assert.match(completionSource, /if \\(stats\\?\\.permanentlyCompleted\\) \\{\\s+return strings\\.completed;/);
'''
          )

          changelog = Path("docs/CHANGELOG.md")
          changelog_text = changelog.read_text()
          entry = '''## v0.33.1

- Moved current objective completion preparation into the launch-ready gate so the selected district and its paired city/district snapshot are hydrated or calculated behind the branded overlay instead of competing with the first interactive map frame or an immediately started walk.
- Reused geometry-compatible permanent completion snapshots across unrelated exploration-revision changes and made permanently completed objectives display as 100% with a full progress bar and zero remaining cells, preventing a later raw denominator refresh from visually demoting an earned completion.
- Added focused UI regression checks for launch completion readiness and permanent-completion presentation, and synchronized version 0.33.1 with iOS build 220 and Android version code 220.

'''
          if "## v0.33.1" not in changelog_text:
              changelog.write_text(changelog_text.replace("# Changelog\n\n", "# Changelog\n\n" + entry, 1))

          overview = Path("docs/PROJECT_OVERVIEW.md")
          overview_text = overview.read_text()
          overview_text = overview_text.replace(
              '- Ready-gated transition from the launch loader to the map through a discreet `Press here to start` control on every launch.',
              '- Ready-gated transition from the launch loader to the map through a discreet `Press here to start` control on every launch; the gate now includes completion preparation for the selected objective and its paired city/district so uncached local scans finish before the first interactive map frame.'
          )
          overview_text = overview_text.replace(
              '- Permanent exact-boundary completion achievements with district and city rollups that remain earned across later OSM changes and cache clearing.',
              '- Permanent exact-boundary completion achievements with district and city rollups that remain earned across later OSM changes and cache clearing; once earned, objective presentation remains at 100% with zero remaining cells even when a later raw denominator differs.'
          )
          overview_text = overview_text.replace(
              '- Objective scope changes use stale-while-revalidate memory and SQLite snapshots keyed by exploration revision and boundary fingerprint; paired district/city results precompute together, while active unfinished-recording previews remain memory-only.',
              '- Objective scope changes use stale-while-revalidate memory and SQLite snapshots keyed by exploration revision and boundary fingerprint; the launch objective and paired district/city results precompute behind the launch overlay, geometry-compatible permanent snapshots may bypass unrelated global revision churn, and active unfinished-recording previews remain memory-only.'
          )
          overview.write_text(overview_text)

          architecture = Path("docs/ARCHITECTURE.md")
          architecture_text = architecture.read_text()
          old_arch = '''Forbidden Zone hydration is deliberately outside the launch-critical saved-map query batch. The launch gate becomes ready from the existing core map data, then loads the independent purple layer after dismissal; likewise, an uncached administrative completion scan cannot begin while the branded launch overlay is active. This keeps an upgrade or invalidated completion cache from stalling the Start interaction.'''
          new_arch = '''Forbidden Zone hydration remains outside the launch-critical saved-map query batch, but completion for the final launch objective is intentionally different: once the core saved map, recovery state, current boundary context, and objective are resolved, the selected district plus its paired city/district completion snapshots are hydrated or calculated while the branded overlay is still visible. The launch gate does not expose Start until that objective-completion request settles, so an uncached local scan cannot compete with the first interactive map frame or an immediately started recording. A geometry-compatible snapshot that already represents a permanent completion can be reused across unrelated global exploration-revision changes because the achievement is immutable; detailed Completion views can still recalculate current raw counts independently.'''
          if old_arch in architecture_text:
              architecture_text = architecture_text.replace(old_arch, new_arch, 1)
          else:
              architecture_text += "\n\n" + new_arch + "\n"
          architecture.write_text(architecture_text)

          testing = Path("docs/TESTING.md")
          testing_text = testing.read_text()
          launch_test = '''## Launch Completion Prefetch Test

1. Use a development build with a cached exact city/district boundary and a saved district objective.
2. Complete that district to 100%, force-close the app, and reopen it. Expected: the branded launch overlay remains until the objective completion request settles; the first visible map frame already shows 100%, a full objective bar, and zero remaining cells without a visible `Calculating...` or `Updating district...` phase.
3. Start a walk immediately after entering the map. Expected: recording controls, GPS state, duration, steps, and map interaction remain responsive because launch completion work is no longer starting alongside the walk.
4. Add exploration that advances the global walking revision outside the completed district, force-close, and reopen. Expected: the geometry-compatible permanent district snapshot is reused and still displays 100% without a district rescan.
5. Repeat with an incomplete district after adding new exploration inside it. Expected: the objective and its paired city/district snapshot refresh behind the launch overlay, and the first map frame shows the refreshed percentage.

'''
          if "## Launch Completion Prefetch Test" not in testing_text:
              marker = "## Common Issues"
              if marker in testing_text:
                  testing_text = testing_text.replace(marker, launch_test + marker, 1)
              else:
                  testing_text += "\n" + launch_test
          testing.write_text(testing_text)

          readme = Path("README.md")
          readme_text = readme.read_text()
          readme_text = readme_text.replace("Current version: `v0.33.0`", "Current version: `v0.33.1`")
          old_readme = '''Forbidden Zone hydration is deliberately outside the launch-critical saved-map query batch. The launch gate becomes ready from the existing core map data, then loads the independent purple layer after dismissal; likewise, an uncached administrative completion scan cannot begin while the branded launch overlay is active. This keeps an upgrade or invalidated completion cache from stalling the Start interaction.'''
          new_readme = '''Forbidden Zone hydration remains outside the launch-critical saved-map query batch. Objective completion now follows a separate launch policy: after the final current city/district objective is resolved, its completion snapshot and paired city/district value are hydrated or calculated behind the branded overlay before Start is exposed. Geometry-compatible permanent completion snapshots can be reused across unrelated exploration-revision churn, keeping an already completed objective immediately at 100% while preventing expensive scans from competing with the first map interaction or a newly started walk.'''
          if old_readme in readme_text:
              readme_text = readme_text.replace(old_readme, new_readme, 1)
          readme.write_text(readme_text)
          PY

          npm version 0.33.1 --no-git-tag-version

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("app.json")
          data = json.loads(path.read_text())
          data["expo"]["version"] = "0.33.1"
          data["expo"]["ios"]["buildNumber"] = "220"
          data["expo"]["android"]["versionCode"] = 220
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Geometry regressions
        run: npm run test:geometry

      - name: Zone regressions
        run: npm run test:zones

      - name: UI regressions
        run: npm run test:ui

      - name: Documentation consistency
        run: npm run test:docs

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/mapbound-ios-export

      - name: Commit validated fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-launch-completion-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix launch completion prefetch"
          git push origin HEAD:fix/launch-completion-prefetch
